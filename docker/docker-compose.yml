# version: '3.8'

services:
  carla_server:
    container_name: carla_server-09101
    image: carlasim/carla:0.9.10.1
    runtime: nvidia
    network_mode: host
    environment:
      - DISPLAY=:1
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash CarlaUE4.sh -nosound
  
  # carla_server-headless:
  #   container_name: carla_server-headless-09101
  #   image: carlasim/carla:0.9.10.1
  #   runtime: nvidia
  #   network_mode: host
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #     - NVIDIA_DRIVER_CAPABILITIES=all
  #   command: bash CarlaUE4.sh -RenderOffScreen -nosound
  
  tcp-carla:
    build:
      context: py37
      dockerfile: Dockerfile
    image: tcp-carla:0.9.10.1
    container_name: tcp-carla-09101
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    environment:
      - DISPLAY=$DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SHELL=/bin/bash
    volumes:
      - ../:/workspace/TCP
      - ~/carla_0.9.10.1:/workspace/carla
      - /tmp/.X11-unix:/tmp/.X11-unix
    stdin_open: true
    tty: true

  dl-work:
    build:
      context: py311
      dockerfile: Dockerfile
    image: dl-work:3.11-cuda12.6-torch2.8.0
    container_name: dl-work-py311
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    environment:
      - DISPLAY=$DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SHELL=/bin/bash
    volumes:
      - ../:/workspace/TCP
      - /tmp/.X11-unix:/tmp/.X11-unix
    stdin_open: true
    tty: true
